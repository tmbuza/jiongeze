project:
  type: book
  output-dir: docs

bibliography: library/references.bib
date: last-modified
date-format: "MMM YYYY"

book:
  title: "Jiongeze"
  subtitle: "From Knowledge to Opportunity"

  chapters:

    - index.qmd

    - part: "Jiongeze"
      chapters:
        - 00-preface.qmd
        - 01-about-jiongeze.qmd
        - 02-youth-initiative.qmd
        - 03-idea-bank.qmd
        - 04-community-projects.qmd
        - 05-ambassador-pathway.qmd

    - part: "Learning Pathway"
      chapters:
        - learning/01-computer-confidence.qmd
        - learning/02-keyboard-and-typing.qmd
        - learning/03-files-and-folders.qmd
        - learning/04-opening-files.qmd
        - learning/05-community-observation.qmd
        - learning/06-understanding-flyers.qmd
        - learning/07-sharing-files.qmd
        - learning/08-my-first-community-project.qmd

    - part: "Journeys"
      chapters:
        - journeys/01-hamis-journey.qmd

    - part: "Community Projects"
      chapters:
        - projects/01-flyer-distribution.qmd
        - projects/02-brochure-support.qmd
        - projects/03-community-message-design.qmd

    - part: "Reference Resources"
      chapters:
        - resources/01-jiongeze-learning-map.qmd
        - resources/02-swahili-english-terms.qmd
        - resources/03-computer-basics.qmd
        - resources/04-printing-workflow.qmd

  appendices:
    - 999-about-this-guide.qmd
    - 999-swahili-english-terms.qmd
    - 999-computer-basics.qmd
    - 999-printing-workflow.qmd
    - 999-community-resources.qmd
    - 999-project-gallery.qmd
    - 999-frequently-asked-questions.qmd
    - 999-next-steps.qmd

format:
  html:
    theme: cosmo  
    toc: true
    toc-depth: 3
    number-sections: false
    number-depth: 2
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    css: assets/css/cdi.css
    code-fold: true
    mermaid:
      theme: forest

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
  working-dir: .